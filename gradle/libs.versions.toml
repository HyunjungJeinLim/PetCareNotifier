[versions]
agp = "8.9.1"
kotlin = "1.9.24"

# AndroidX and UI
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
coreKtx = "1.15.0"

# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

# Room
room = "2.6.1"

# Google Play Services
play-services-auth = "20.7.0"

# Google API Client stack
google-api-client = "1.34.0"
google-api-services-calendar = "v3-rev411-1.25.0"
google-http-client = "1.42.3"
google-oauth-client = "1.34.1"
gson = "2.10.1"

[libraries]
# AndroidX and UI
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Google Play Auth
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }

# Google API Client and Calendar
google-api-client = { group = "com.google.api-client", name = "google-api-client", version.ref = "google-api-client" }
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "google-api-client" }
google-api-client-gson = { group = "com.google.api-client", name = "google-api-client-gson", version.ref = "google-api-client" }
google-http-client = { group = "com.google.http-client", name = "google-http-client", version.ref = "google-http-client" }
google-http-client-android = { group = "com.google.http-client", name = "google-http-client-android", version.ref = "google-http-client" }
google-oauth-client = { group = "com.google.oauth-client", name = "google-oauth-client", version.ref = "google-oauth-client" }
google-oauth-client-jetty = { group = "com.google.oauth-client", name = "google-oauth-client-jetty", version.ref = "google-oauth-client" }
google-calendar = { group = "com.google.apis", name = "google-api-services-calendar", version = "v3-rev411-1.25.0" }

# JSON
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
